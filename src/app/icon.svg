<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shophub-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Gloss highlight -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Shadow filter for crisp depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#2e1065" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#shophub-grad)" />

  <!-- Subtle border highlight -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

  <!-- Subtle top gloss curve -->
  <path d="M2 18 C2 9.163 9.163 2 18 2 L46 2 C54.837 2 62 9.163 62 18 L62 25 C46 29 18 29 2 25 Z" fill="url(#gloss)" />

  <!-- Shopping Bag Handle Arc -->
  <path d="M24.5 21 C24.5 16 27.8 12.5 32 12.5 C36.2 12.5 39.5 16 39.5 21" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Stylized ShopHub "S" Monogram -->
  <path d="M38 27 C36.5 25.5 34.5 24.5 32 24.5 C27.5 24.5 24 27.8 24 31.8 C24 38 35.5 36.8 35.5 42 C35.5 45.2 32.8 47.2 29 47.2 C25.2 47.2 22.8 45 21.5 42.5" 
        stroke="#FFFFFF" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- VIP Sparkle Accent Dot -->
  <circle cx="44" cy="27" r="2.5" fill="#FBBF24" />
  <circle cx="44" cy="27" r="1.2" fill="#FFFFFF" />
</svg>
